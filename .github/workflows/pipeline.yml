name: Fuzzing CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-app:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.10-eclipse-temurin-17
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./mvnw && ./mvnw -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ./target/*.jar

  fuzzing:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./target
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      
      - name: Start application
        run: |
          java -jar target/*.jar &
          echo "Waiting for app to start..."
          sleep 20
      
      - name: Install ffuf
        run: sudo apt-get update && sudo apt-get install -y ffuf
      
      - name: Run directory fuzzing
        continue-on-error: true
        run: |
          echo "Running fuzzing test..."
          ffuf -u "http://localhost:8080/FUZZ" \
            -w /usr/share/dict/words \
            -mc 200,204,301,302,403 \
            -t 20 \
            -timeout 3 \
            -o ffuf-report.json \
            -of json
      
      - name: Check results
        run: |
          if [ -f ffuf-report.json ]; then
            echo "Fuzzing completed. Results:"
            cat ffuf-report.json | jq '.results | length' || echo "No JSON results"
          else
            echo "No fuzzing report generated"
          fi
      
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-report
          path: ffuf-report.json