name: SAST,SCA,DAST_CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    container:
      image: maven:3.9.10-eclipse-temurin-21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build with Maven Wrapper
        run: ./mvnw -B clean package

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vuln
          path: ./target/*.jar

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    needs: build-app
    container:
      image: returntocorp/semgrep:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SAST (Semgrep)
        run: |
          semgrep --config auto --json > gl-sast-report.json || true

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: gl-sast-report
          path: gl-sast-report.json

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    needs: sast
    container:
      image: maven:3.9.10-eclipse-temurin-21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run SCA (OWASP Dependency-Check)
        run: ./mvnw -B verify

      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ./target/dependency-check-report.html

  dast-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    needs:
      - sca
      - build-app
    container:
      image: zaproxy/zap-stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: vuln
          path: ./target

      - name: Run application
        run: |
          java -jar ./target/*.jar &
          sleep 30

      - name: Run ZAP Baseline Scan
        run: |
          zap-baseline.py -t http://localhost:8080 > zap-baseline-report.txt || true

      - name: Upload ZAP Baseline report
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-baseline-report.txt

  dast-api:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    needs:
      - sca
      - build-app
    container:
      image: zaproxy/zap-stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: vuln
          path: ./target

      - name: Run application
        run: |
          java -jar ./target/*.jar &
          sleep 30

      - name: Run ZAP API Scan
        run: |
          zap-api-scan.py -t http://localhost:8080/v3/api-docs -f openapi > zap-api-report.txt || true

      - name: Upload ZAP API report
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: zap-api-report.txt
