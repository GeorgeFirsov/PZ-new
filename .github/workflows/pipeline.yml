name: Fuzzing CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-app:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.10-eclipse-temurin-17
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x ./mvnw && ./mvnw -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ./target/*.jar

  fuzzing:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./target
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      
      - name: Start application
        run: |
          java -jar target/*.jar &
          echo "Waiting for app to start..."
          sleep 30
      
      - name: Install ffuf and wordlist
        run: |
          sudo apt-get update
          sudo apt-get install -y ffuf wget
          # Скачиваем базовый словарь
          wget -q https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt -O common.txt
      
      - name: Run directory fuzzing
        continue-on-error: true
        run: |
          echo "Running fuzzing test..."
          ffuf -u "http://localhost:8080/FUZZ" \
            -w common.txt \
            -mc 200,204,301,302,403 \
            -t 20 \
            -timeout 3 \
            -o ffuf-report.json \
            -of json
      
      - name: Check results
        run: |
          if [ -f ffuf-report.json ]; then
            echo "Fuzzing completed successfully"
            RESULTS_COUNT=$(cat ffuf-report.json | jq '.results | length' 2>/dev/null || echo "0")
            echo "Found $RESULTS_COUNT endpoints"
          else
            echo "No fuzzing report generated"
          fi
      
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-report
          path: |
            ffuf-report.json
            common.txt