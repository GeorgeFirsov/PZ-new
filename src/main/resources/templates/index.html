<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Course Management</title>
</head>
<body>
<h2>Course Management</h2>

<div th:if="${session.username}">
    <p>Вы вошли как: <span th:text="${session.username}"></span> 
    (<span th:text="${session.role}"></span>)</p>
    
    <p>
        <a href="/students">Студенты</a> |
        <a href="/courses">Курсы</a>
        
        <span th:if="${session.role == 'ADMIN'}">
            | <a href="/admin/users">Управление пользователями</a>
        </span>
        
        | <a href="/logout">Выйти</a>
    </p>
    
    <div th:if="${session.role == 'TEACHER' or session.role == 'ADMIN'}">
        <p><strong>Доступные функции:</strong> создание и импорт курсов</p>
    </div>
</div>

<div th:unless="${session.username}">
    <p><a href="/login">Войти</a> | <a href="/login">Зарегистрироваться</a></p>
</div>

<p>Тестовые пользователи: admin/Admin123!, teacher/Teacher123!, student/Student123!</p>
</body>
</html>
